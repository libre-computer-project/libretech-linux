%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/amlogic/amlogic,gxl-ddr-pub-mon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic GXL DDR PHY (PUB) VT telemetry monitor

maintainers:
  - Da Xue <da@libre.computer>

description: |
  Monitor registers of the Amlogic GXL DDR PHY ("PUB") VT tracking delay
  lines.

properties:
  compatible:
    const: amlogic,gxl-ddr-pub-mon

  reg:
    maxItems: 1

  amlogic,sc-shmem:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle of the SC-published statistics block, a child of the SRAM
      controller described by
      Documentation/devicetree/bindings/soc/amlogic/amlogic,gxl-pubmon-sc-shmem.yaml.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    sram@c8000000 {
        compatible = "mmio-sram";
        reg = <0xc8000000 0x14000>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0 0xc8000000 0x14000>;

        pubmon_sc_shmem: pubmon-sram@11c00 {
            compatible = "amlogic,gxl-pubmon-sc-shmem";
            reg = <0x11c00 0x400>;
        };
    };

    ddr-pub@c8836000 {
        compatible = "amlogic,gxl-ddr-pub-mon";
        reg = <0xc8836000 0x1000>;
        amlogic,sc-shmem = <&pubmon_sc_shmem>;
    };
